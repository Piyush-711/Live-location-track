# All replicas must use the same PostgreSQL database and issuer configuration.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
app:
  auth:
    issuer: ${AUTH_ISSUER}
    audience: ${AUTH_AUDIENCE}
    jwk-set-uri: ${AUTH_JWK_SET_URI}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
