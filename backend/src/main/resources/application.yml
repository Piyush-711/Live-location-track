server:
  port: ${PORT:8080}
  shutdown: graceful
  max-http-request-header-size: 16KB
  tomcat:
    threads:
      max: 100
      min-spare: 5
    accept-count: 100
    max-connections: 1000
    connection-timeout: 10s
spring:
  application:
    name: local-travel-service
  lifecycle:
    timeout-per-shutdown-phase: 15s
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/local-travel;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 5000
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-trailing-tokens: true
  servlet:
    multipart:
      enabled: false
app:
  auth:
    issuer: ${AUTH_ISSUER:}
    audience: ${AUTH_AUDIENCE:}
    jwk-set-uri: ${AUTH_JWK_SET_URI:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
logging:
  level:
    root: INFO
    com.local.travel: INFO
